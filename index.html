<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Makifind</title>
  <link rel="stylesheet" href="css/ae.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/interface.css">
</head>
<body>
  <div class="shell">
    <div class="search-row">
      <label class="search ae-field">
        <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4.5 4.5"/></svg>
        <input id="q" type="text" placeholder="Find an effect" spellcheck="false" autocomplete="off" autofocus>
        <span id="count" class="count"></span>
      </label>
      <span id="gear-slot" class="gear-slot"></span>
    </div>

    <nav class="chips ae-tabs">
      <button data-filter="all" class="on">All</button>
      <button data-filter="fav">Favorites</button>
      <button data-filter="recent">Recent</button>
      <span class="spacer"></span>
      <button id="refresh" class="ae-icon" title="Reload the effect list (after installing plug-ins)">
        <svg viewBox="0 0 20 20"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 3.5v3.2h-3.2"/></svg>
      </button>
    </nav>

    <ul id="list" class="list" role="listbox"></ul>

    <footer class="hints">
      <span><kbd>↑</kbd><kbd>↓</kbd> select</span>
      <span><kbd>Enter</kbd> apply</span>
      <span><kbd>Shift</kbd>+<kbd>Enter</kbd> on adjustment layer</span>
      <span><kbd>Ctrl</kbd>+<kbd>S</kbd> favorite</span>
    </footer>
  </div>
  <div id="toast" class="toast"></div>
  <script src="js/interface.js"></script>
  <script src="js/search.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
